name: Deploy Chartered Archive to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          # Optional: configure these in GitHub Repo Settings -> Secrets and variables -> Actions
          # (or leave unset if you placed IDs directly inside src/config/driveConfig.ts)
          VITE_GOOGLE_DRIVE_API_KEY: ${{ secrets.VITE_GOOGLE_DRIVE_API_KEY }}
          VITE_DRIVE_FR_MODULES_FOLDER_ID: ${{ vars.VITE_DRIVE_FR_MODULES_FOLDER_ID }}
          VITE_DRIVE_FR_REVISIONS_FOLDER_ID: ${{ vars.VITE_DRIVE_FR_REVISIONS_FOLDER_ID }}
          VITE_DRIVE_FR_COMBINED_FOLDER_ID: ${{ vars.VITE_DRIVE_FR_COMBINED_FOLDER_ID }}
          VITE_DRIVE_FR_QUIZ_FOLDER_ID: ${{ vars.VITE_DRIVE_FR_QUIZ_FOLDER_ID }}
          VITE_DRIVE_AA_MODULES_FOLDER_ID: ${{ vars.VITE_DRIVE_AA_MODULES_FOLDER_ID }}
          VITE_DRIVE_AA_REVISIONS_FOLDER_ID: ${{ vars.VITE_DRIVE_AA_REVISIONS_FOLDER_ID }}
          VITE_DRIVE_AA_COMBINED_FOLDER_ID: ${{ vars.VITE_DRIVE_AA_COMBINED_FOLDER_ID }}
          VITE_DRIVE_AA_QUIZ_FOLDER_ID: ${{ vars.VITE_DRIVE_AA_QUIZ_FOLDER_ID }}
          VITE_DRIVE_AFM_MODULES_FOLDER_ID: ${{ vars.VITE_DRIVE_AFM_MODULES_FOLDER_ID }}
          VITE_DRIVE_AFM_REVISIONS_FOLDER_ID: ${{ vars.VITE_DRIVE_AFM_REVISIONS_FOLDER_ID }}
          VITE_DRIVE_AFM_COMBINED_FOLDER_ID: ${{ vars.VITE_DRIVE_AFM_COMBINED_FOLDER_ID }}
          VITE_DRIVE_AFM_QUIZ_FOLDER_ID: ${{ vars.VITE_DRIVE_AFM_QUIZ_FOLDER_ID }}
          VITE_DRIVE_IDT_MODULES_FOLDER_ID: ${{ vars.VITE_DRIVE_IDT_MODULES_FOLDER_ID }}
          VITE_DRIVE_IDT_REVISIONS_FOLDER_ID: ${{ vars.VITE_DRIVE_IDT_REVISIONS_FOLDER_ID }}
          VITE_DRIVE_IDT_COMBINED_FOLDER_ID: ${{ vars.VITE_DRIVE_IDT_COMBINED_FOLDER_ID }}
          VITE_DRIVE_IDT_QUIZ_FOLDER_ID: ${{ vars.VITE_DRIVE_IDT_QUIZ_FOLDER_ID }}
          VITE_DRIVE_DT_MODULES_FOLDER_ID: ${{ vars.VITE_DRIVE_DT_MODULES_FOLDER_ID }}
          VITE_DRIVE_DT_REVISIONS_FOLDER_ID: ${{ vars.VITE_DRIVE_DT_REVISIONS_FOLDER_ID }}
          VITE_DRIVE_DT_COMBINED_FOLDER_ID: ${{ vars.VITE_DRIVE_DT_COMBINED_FOLDER_ID }}
          VITE_DRIVE_DT_QUIZ_FOLDER_ID: ${{ vars.VITE_DRIVE_DT_QUIZ_FOLDER_ID }}
          VITE_FEEDBACK_APPS_SCRIPT_URL: ${{ vars.VITE_FEEDBACK_APPS_SCRIPT_URL }}
          VITE_DESCRIPTIVE_APPS_SCRIPT_URL: ${{ vars.VITE_DESCRIPTIVE_APPS_SCRIPT_URL }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload dist artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
